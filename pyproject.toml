[tool.poetry]
name = "auto-sklearn"
version = "0.1.0"
description = "Automated machine learning."
authors = ["Matthias Feurer <feurerm@informatik.uni-freiburg.de>"]
license = "BSD-3-Clause"
readme = "README.md"
homepage = "https://automl.github.io/auto-sklearn"
repository = "https://github.com/automl/auto-sklearn"
keywords = ["automl", "machine-learning", "data-science"]
packages = [
    { include = "autosklearn" },
    { include = "test", format = "sdist" },
]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: BSD License",
    "Natural Language :: English",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Information Analysis",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev]
optional = true

[tool.poetry.group.dev.dependencies]
pytest = ">=4.6"
pytest-cov = "*"
pytest-forked = "*"
pytest-timeout = "*"
pytest-cases = ">=3.6.11"
mypy = "*"
isort = "*"
black = "*"
pydocstyle = "*"
openml = "*"
pre-commit = "*"
matplotlib = "*"
jupyter = "*"
notebook = "*"
seaborn = "*"
sphinx = "<4.3"
sphinx-gallery = "*"
sphinx-bootstrap-theme = "*"
numpydoc = "*"
sphinx-toolbox = "*"
docutils = "==0.16"

[tool.poetry.scripts]
auto-sklearn = "autosklearn.cli:main"
auto-sklearn-plugins = "autosklearn.plugins.cli:main"

[tool.benchmark]
autosave = true
save = "current"
compare = "0001"
min_rounds = 5
min_time = 0.000001
warmup = false
warmup_time = 0.000001
